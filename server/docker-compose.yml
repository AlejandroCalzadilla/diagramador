version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chartdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-chartdb}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-chartdb_password}
      POSTGRES_DB: ${DATABASE_NAME:-chartdb}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
